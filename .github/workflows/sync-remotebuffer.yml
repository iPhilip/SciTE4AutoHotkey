name: Sync RemoteBuffer

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [remotebuffer-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SciTE4AutoHotkey
        uses: actions/checkout@v4

      - name: Download RemoteBuffer_Class.ahk
        run: |
          curl -L "https://raw.githubusercontent.com/iPhilip/RemoteBuffer/main/Lib/RemoteBuffer_Class.ahk" \
          -o Lib/RemoteBuffer_Class.ahk

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Lib/RemoteBuffer_Class.ahk
          git diff --cached --quiet || git commit -m "Sync RemoteBuffer_Class.ahk from RemoteBuffer repo"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}